<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedometer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="speedometer" class="speedometer-container">
        <div class="speedometer-content">
            <div class="info-row">
                <span id="gear-value" class="gear-display">N</span>
                <div class="speed-group">
                    <span id="speed-value" class="speed-value">0</span>
                    <span id="speed-unit" class="speed-unit">MPH</span>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
